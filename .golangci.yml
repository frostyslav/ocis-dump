version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - perfsprint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests may write fixtures with relaxed permissions.
      - path: _test\.go
        linters:
          - gosec
          - unparam
      # The tools intentionally create user-readable output trees.
      - linters:
          - gosec
        text: "G301|G302|G304|G306|G703"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/frostyslav/ocis-dump
